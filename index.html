<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="description" content="Keto-Dashboard: Barcode scannen, Nährwerte prüfen, persönliche Zielwerte.">
<title>Keto-Dashboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">🥑 Keto-Dashboard</span>
    <button id="profileSwitch" class="profile-switch" type="button" aria-label="Profil wechseln">
      <span id="profileSwitchName">–</span>
    </button>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar" aria-label="Hauptnavigation">
  <button class="tab-btn" data-tab="start" type="button">
    <span class="tab-icon">🏠</span><span class="tab-label">Start</span>
  </button>
  <button class="tab-btn" data-tab="scan" type="button">
    <span class="tab-icon">📷</span><span class="tab-label">Scan</span>
  </button>
  <button class="tab-btn" data-tab="lists" type="button">
    <span class="tab-icon">📋</span><span class="tab-label">Listen</span>
  </button>
  <button class="tab-btn" data-tab="recipes" type="button">
    <span class="tab-icon">🍳</span><span class="tab-label">Rezepte</span>
  </button>
  <button class="tab-btn" data-tab="profile" type="button">
    <span class="tab-icon">⚙️</span><span class="tab-label">Profil</span>
  </button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
